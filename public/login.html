<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk - Aplikasi Yang Menurut Kamu Lagi Hype Enterprise</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --accent-from: #3B82F6;
            --accent-to: #10B981;
        }
        .gradient-bg { background: linear-gradient(135deg, var(--accent-from), var(--accent-to)); }
        .glass { background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.2); }
        .input-glass { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); }
        .btn-primary { background: linear-gradient(90deg, var(--accent-from), var(--accent-to)); }
        .btn-primary:hover { opacity: 0.9; }
    </style>
</head>
<body class="bg-gray-900 text-white font-sans">
    <div class="min-h-screen flex items-center justify-center gradient-bg p-4">
        <div class="glass p-8 rounded-lg shadow-xl w-full max-w-md">
            <h2 class="text-3xl font-bold text-center mb-6">Masuk</h2>
            <p class="text-center text-gray-300 mb-8">Aplikasi Yang Menurut Kamu Lagi Hype Enterprise</p>

            <form id="loginForm" class="space-y-6">
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-300 mb-2">Email</label>
                    <input type="email" id="email" name="email" required
                           class="w-full px-4 py-2 rounded-md input-glass text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-400">
                </div>
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-300 mb-2">Kata Sandi</label>
                    <input type="password" id="password" name="password" required
                           class="w-full px-4 py-2 rounded-md input-glass text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-400">
                </div>
                <button type="submit"
                        class="w-full btn-primary text-white py-2 rounded-md font-semibold transition duration-300">
                    Masuk
                </button>
            </form>

            <p class="text-center text-gray-400 mt-6">
                Belum punya akun?
                <a href="#" class="text-blue-300 hover:underline">Daftar Sekarang</a>
            </p>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(event) {
            event.preventDefault();
            // In a real application, you would send this data to your backend for authentication.
            // For now, we'll just simulate a successful login and redirect.
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            console.log('Email:', email);
            console.log('Password:', password);

            // Simulate API call
            setTimeout(() => {
                alert('Login Berhasil! Mengarahkan ke Dashboard...');
                window.location.href = '/dashboard.html'; // Redirect to dashboard
            }, 1000);
        });
    </script>
</body>
</html>
