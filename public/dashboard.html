<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Yang Menurut Kamu Lagi Hype Enterprise - Project Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --accent-from: #3B82F6; /* Blue-500 */
            --accent-to: #10B981;   /* Emerald-500 */
        }
        .gradient-text {
            background: linear-gradient(to right, var(--accent-from), var(--accent-to));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .gradient-bg-hover:hover {
            background: linear-gradient(135deg, var(--accent-from), var(--accent-to));
            color: white;
        }
        .sidebar-link.active {
            background: linear-gradient(to right, var(--accent-from), var(--accent-to));
            color: white;
            font-weight: 600;
        }
        .modal {
            display: none; /* Hidden by default */
            position: fixed; /* Stay in place */
            z-index: 1000; /* Sit on top */
            left: 0;
            top: 0;
            width: 100%; /* Full width */
            height: 100%; /* Full height */
            overflow: auto; /* Enable scroll if needed */
            background-color: rgba(0,0,0,0.4); /* Black w/ opacity */
            align-items: center;
            justify-content: center;
        }
        .modal-content {
            background-color: #1f2937; /* bg-gray-800 */
            margin: auto;
            padding: 2rem;
            border-radius: 0.5rem;
            width: 90%;
            max-width: 600px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            position: relative;
        }
        .close-button {
            position: absolute;
            top: 1rem;
            right: 1.5rem;
            font-size: 1.5rem;
            font-weight: bold;
            color: #9ca3af; /* text-gray-400 */
            cursor: pointer;
        }
        .close-button:hover {
            color: #e5e7eb; /* text-gray-200 */
        }
    </style>
</head>
